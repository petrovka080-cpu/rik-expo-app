name: Platform Core Verification V1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-current-core:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore isolated canonical path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $canonical = 'C:\\dev\\rik-expo-app-r4a5-dc4f0ce7'
          if (Test-Path -LiteralPath $canonical) { throw 'Isolated canonical target must be absent' }
          New-Item -ItemType Directory -Force -Path 'C:\\dev' | Out-Null
          git clone --no-hardlinks --no-checkout (Join-Path $env:GITHUB_WORKSPACE 'source') $canonical
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          git -C $canonical -c core.autocrlf=false checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
      - name: Cache locked Node dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: C:/dev/rik-expo-app-r4a5-dc4f0ce7/node_modules
          key: core-r13-windows-node20.19.6-${{ hashFiles('source/package-lock.json') }}
      - name: Install locked verification dependencies
        shell: pwsh
        working-directory: C:/dev/rik-expo-app-r4a5-dc4f0ce7
        run: |
          if ('${{ steps.dependencies.outputs.cache-hit }}' -ne 'true') {
            npm ci --include=dev --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m pip install psutil==7.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified locked dependencies before source checks
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/dev/rik-expo-app-r4a5-dc4f0ce7/node_modules
          key: core-r13-windows-node20.19.6-${{ hashFiles('source/package-lock.json') }}
      - name: Exact full Program in one fresh owned process
        shell: pwsh
        working-directory: C:/dev/rik-expo-app-r4a5-dc4f0ce7
        run: python scripts/verification/current-core-wave-r75/driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-core-r75-exact-source-results
          path: C:/dev/rik-expo-app-r4a5-dc4f0ce7/.release-runtime/current-core-wave-r75-ci
          if-no-files-found: error
          retention-days: 7
