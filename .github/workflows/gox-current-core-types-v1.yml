name: GOX exact current core types
run-name: GOX current core types ${{ github.sha }}
on:
  push:
    branches: ['codex/gox-types-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gox-current-core-types
  cancel-in-progress: false
jobs:
  full-affected-types:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Restore exact reviewed source bytes
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: python scripts/verification/gox-current-types-v1/bootstrap_source.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$env:GOX_TYPES_OUTPUT_ROOT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: python -m pip install psutil==7.1.0
      - name: Full current affected program with memory guard
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$env:GOX_TYPES_OUTPUT_ROOT"
      - name: Exact affected Jest - admission
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-admission'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch admission
      - name: Exact affected Jest - contracts
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-contracts'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch contracts
      - name: Exact affected Jest - owners
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-owners'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch owners
      - name: Exact affected Jest - ui-render
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-ui-render'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch ui-render
      - name: Exact affected Jest - ui-cold
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-ui-cold'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch ui-cold
      - name: Exact affected Jest - ui-contract
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-ui-contract'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch ui-contract
      - name: Exact affected Jest - ui-procurement
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-ui-procurement'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch ui-procurement
      - name: Exact affected Jest - developer-runtime
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GOX_TYPES_OUTPUT_ROOT: ${{ runner.temp }}/gox-types-${{ github.run_id }}
        run: |
          $taskStageOutput = Join-Path $env:GOX_TYPES_OUTPUT_ROOT 'jest-developer-runtime'
          New-Item -ItemType Directory -Path $taskStageOutput -ErrorAction Stop | Out-Null
          python scripts/verification/gox-current-types-v1/guard.py --root "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" --output "$taskStageOutput" --stage jest --batch developer-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gox-current-types-${{ github.run_id }}
          path: ${{ runner.temp }}/gox-types-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
