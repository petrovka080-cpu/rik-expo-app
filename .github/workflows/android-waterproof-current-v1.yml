name: Current canonical WaterProof APK V1
run-name: WaterProof bounded identity APK ${{ inputs.source_commit || 'c73650135a1c7f133c491ce85e06824cf9871592' }}
on:
  push:
    branches: ['codex/gox-types-operations-resources-r580']
    paths: ['.github/workflows/android-waterproof-current-v1.yml', 'scripts/verification/android-waterproof-current-v1/inputs/current-build-r750.json']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact approved public APK source snapshot commit (40 hex)
        required: true
        type: string
      build_spec_path:
        description: Repo-relative fresh public build contract in workflow checkout
        required: true
        type: string
      build_spec_sha256:
        description: Exact fresh public build contract SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: canonical-current-waterproof-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Preserve exact source bytes before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/verification/android-waterproof-current-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate dispatch paths and hashes
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || 'c73650135a1c7f133c491ce85e06824cf9871592' }}
          BUILD_SPEC_PATH: ${{ inputs.build_spec_path || 'scripts/verification/android-waterproof-current-v1/inputs/current-build-r750.json' }}
          BUILD_SPEC_SHA: ${{ inputs.build_spec_sha256 || 'a6407413fc64fefe4990338605593043fd2272aa03d2995be599fafdd78cbb9a' }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Exact commit required' }
          if ($env:BUILD_SPEC_SHA -notmatch '^[a-f0-9]{64}$') { throw 'Exact build contract hash required' }
          if ($env:BUILD_SPEC_PATH -notmatch '^scripts/verification/android-waterproof-current-v1/inputs/[A-Za-z0-9._/-]+\.json$' -or $env:BUILD_SPEC_PATH.Contains('..')) { throw 'Unsafe input path' }
          $spec = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'ci') $env:BUILD_SPEC_PATH
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'ci/scripts/verification/android-waterproof-current-v1/bootstrap_exact_workflow.py'
          python $bootstrap --root (Join-Path $env:GITHUB_WORKSPACE 'ci') --commit $env:GITHUB_SHA --path $env:BUILD_SPEC_PATH --sha256 $env:BUILD_SPEC_SHA --report (Join-Path $env:GITHUB_WORKSPACE 'spec-raw-restore.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $spec -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BUILD_SPEC_SHA) { throw 'Input hash changed' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || 'c73650135a1c7f133c491ce85e06824cf9871592' }}
          path: r
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: r/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK prerequisites
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Install process monitor
        run: python -m pip install psutil==7.1.0
      - name: Build and verify exact embedded APK
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || 'c73650135a1c7f133c491ce85e06824cf9871592' }}
          BUILD_SPEC_PATH: ${{ inputs.build_spec_path || 'scripts/verification/android-waterproof-current-v1/inputs/current-build-r750.json' }}
          BUILD_SPEC_SHA: ${{ inputs.build_spec_sha256 || 'a6407413fc64fefe4990338605593043fd2272aa03d2995be599fafdd78cbb9a' }}
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE 'ci/scripts/verification/android-waterproof-current-v1/build_current_apk.py'
          $spec = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'ci') $env:BUILD_SPEC_PATH
          python $driver --root (Join-Path $env:GITHUB_WORKSPACE 'r') --spec $spec --spec-sha256 $env:BUILD_SPEC_SHA --source-commit $env:SOURCE_COMMIT --output (Join-Path $env:GITHUB_WORKSPACE 'apk-artifact')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-waterproof-apk-${{ github.run_id }}
          path: |
            apk-artifact
            spec-raw-restore.json
          if-no-files-found: error
          retention-days: 7
