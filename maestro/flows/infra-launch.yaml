appId: com.azisbek_dzhantaev.rikexpoapp
name: Maestro Infra Launch Probe
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertVisible:
    id: "auth.login.title"
- assertNotVisible: "isn't responding"
- takeScreenshot:
    path: launch-login-screen
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertVisible:
    id: "auth.login.title"
- assertNotVisible: "isn't responding"
- takeScreenshot:
    path: relaunch-login-screen
- stopApp
