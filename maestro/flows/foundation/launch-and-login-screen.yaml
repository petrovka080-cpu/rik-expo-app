appId: com.azisbek_dzhantaev.rikexpoapp
name: Launch And Login Screen
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertVisible:
    id: "auth.login.title"
- assertVisible:
    id: "auth.login.register"
- assertNotVisible: "isn't responding"
- stopApp
