appId: com.azisbek_dzhantaev.rikexpoapp
name: Register Public Path
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertNotVisible: "isn't responding"
- tapOn:
    id: "auth.login.register"
- extendedWaitUntil:
    visible:
      id: "auth.register.screen"
    timeout: 60000
- assertVisible:
    id: "auth.register.submit"
- assertVisible:
    id: "auth.register.login"
- assertNotVisible: "isn't responding"
- stopApp
