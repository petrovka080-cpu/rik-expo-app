appId: com.azisbek_dzhantaev.rikexpoapp
name: Relaunch Stability
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertVisible:
    id: "auth.login.title"
- assertNotVisible: "isn't responding"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.login.screen"
    timeout: 60000
- assertVisible:
    id: "auth.login.title"
- assertNotVisible: "isn't responding"
- stopApp
